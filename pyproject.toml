[project]
name = "ai-rag-embed"
version = "0.1.0"
description = "AI-powered RAG embedding and retrieval system"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "flask>=2.0.0",
    "jieba",
    "mcp[cli]",
    "openai>=1.0.0",
    "pathspec",
    "rank-bm25",
    "sentence-transformers",
    "transformers",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
